apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-kata-runtime
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-kata-runtime-class
      match:
        resources:
          kinds:
            - Pod
      # Optional: exclude specific namespaces like kube-system
      exclude:
        resources:
          namespaces:
            - kube-system
      validate:
        message: "Workloads must use Kata Containers (runtimeClassName: kata)."
        pattern:
          spec:
            runtimeClassName: "kata"


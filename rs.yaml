apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: rs-demo
  labels:
    type: rs
spec:
  replicas: 3
  selector:
    matchLabels:
      release: alphal.1
  template:
    metadata:
      labels:
        release: alphal.1
    spec:
      containers:
      - name: php-redis
        image: nginx:latest
